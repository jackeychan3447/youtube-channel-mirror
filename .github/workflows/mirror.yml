name: Mirror new YouTube uploads

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: youtube-channel-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Find and mirror new videos
        env:
          SOURCE_CHANNEL_ID: ${{ vars.SOURCE_CHANNEL_ID }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python mirror.py

      - name: Save persistent upload state
        if: always()
        run: |
          if [ -f state.json ] && \
             [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update YouTube mirror state"
            git push
          fi
